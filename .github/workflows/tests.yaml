name: Run AuditFlow checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/auditflow

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm run test
